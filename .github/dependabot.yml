version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
      prefix-development: "chore"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 7

  # Dev container features (.devcontainer/devcontainer.json and its lock file).
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      devcontainers:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7

  # The dev container's base image and the Bun image, pinned by digest in
  # .devcontainer/Dockerfile. The devcontainers ecosystem above only updates
  # features, not images.
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
