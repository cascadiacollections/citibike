name: Deploy site and API docs

# Publishes the static site in `site/` plus the API reference, which
# `npm run docs` generates from the JSDoc comments in lib/citibike.js, to
# GitHub Pages. The landing page is plain HTML with no build step. The API
# reference is built fresh on every run and never committed.
#
# This workflow only publishes the site. It never publishes to npm.
on:
  push:
    branches: [master]
    # Kept in sync with the `pull_request` list below by hand; GitHub Actions
    # does not support YAML anchors.
    paths:
      - "site/**"
      - "lib/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  # Build-only validation before merge, so a broken link or a JSDoc change the
  # generator can't read is caught on the PR instead of on master.
  pull_request:
    paths:
      - "site/**"
      - "lib/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  # Allow manual runs from the Actions tab (for the first deploy).
  workflow_dispatch:

# Least privilege: read-only by default. Only the deploy job mints the OIDC
# token and writes to the Pages environment.
permissions:
  contents: read

# One Pages deploy at a time; don't cancel an in-flight publish. PR validation
# is keyed by ref so a new push supersedes the previous one.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'master' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PRs prove the site still builds and every link resolves. They never deploy
  # and declare no `environment:`, so a fork PR can't reach Pages.
  validate:
    name: Build and check site (validation)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build API reference
        run: npm run docs

      - name: Check links
        run: npm run docs:check

  build:
    name: Build site and upload Pages artifact
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build API reference
        run: npm run docs

      - name: Check links
        run: npm run docs:check

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # Deploy is its own job: `actions/deploy-pages` lists artifacts the instant it
  # starts, and in the uploading job that list is often empty for an artifact
  # finalized a moment earlier (actions/deploy-pages#451). The retry runs only
  # when the first attempt never created a deployment.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && needs.build.result == 'success'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Wait for the Pages artifact listing
        if: steps.deployment.outcome == 'failure' && steps.deployment.outputs.page_url == ''
        run: sleep 20

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure' && steps.deployment.outputs.page_url == ''
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Require a successful Pages deploy
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome != 'success'
        run: exit 1
