name: Refresh station snapshot

# Pulls a fresh site/data/stations.json through this library and commits it
# when the station rows actually changed. A push made with the default
# GITHUB_TOKEN does not start other workflows, so a real change also
# dispatches the existing Pages workflow. That is the only deploy this
# file triggers. It never publishes to npm and never deploys the Worker.

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: station-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh snapshot and redeploy Pages if it changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Fetch station snapshot
        run: node scripts/snapshot-stations.js

      - name: Commit if the snapshot changed
        id: commit
        run: |
          if git diff --quiet -- site/data/stations.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/stations.json
          git commit -m "chore: refresh Citi Bike station snapshot"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Redeploy GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref master
