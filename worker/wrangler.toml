# Station-status proxy for the citibike docs site.
# Deploy by hand from this directory. See DEPLOY.md. CI never deploys it.
#
# Workers Free plan. workers.dev hostname, no route, no cron trigger, no
# logpush, and no paid bindings (KV, R2, D1, Queues, Durable Objects).
# src/index.js caches the feed for 60 seconds, about one upstream fetch per
# minute per location. Do not add a scheduled trigger.

name = "citibike-status"
main = "src/index.js"
compatibility_date = "2026-11-25"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Logs stay on so a bad deploy is visible, sampled so a busy day of polls
# does not burn the free 200k log-events/day inclusion. Traces stay sparse.
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 0.1

[observability.traces]
enabled = true
head_sampling_rate = 0.01
